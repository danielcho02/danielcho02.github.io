>검색어를 입력하세요. 공개된 글만 검색됩니다.</p><ol class="results" data-results data-astro-cid-wp2l4cmv></ol><noscript><p class="status" data-astro-cid-wp2l4cmv>검색에는 JavaScript가 필요합니다. 대신 <a href="/writeups/" data-astro-cid-wp2l4cmv>Writeups</a>, <a href="/notes/" data-astro-cid-wp2l4cmv>Notes</a> 목록을 보세요.</p></noscript></section></main></div></body></html><script type="module">
  const form = document.querySelector('[data-search]');
  const input = form.querySelector('input');
  const status = document.getElementById('status');
  const list = document.querySelector('[data-results]');
  let pagefind;
  let latest = 0;

  const render = (results) => {
    list.replaceChildren(
      ...results.map((r) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = r.url;
        a.textContent = r.meta.title ?? r.url;
        const kind = document.createElement('span');
        kind.className = 'kind';
        kind.textContent = r.filters?.kind?.[0] ?? '';
        const path = document.createElement('span');
        path.className = 'path';
        path.textContent = r.url;
        const p = document.createElement('p');
        // Pagefind escapes page text and only adds <mark> around hits.
        p.innerHTML = r.excerpt;
        li.append(path, kind, a, p);
        return li;
      }),
    );
  };

  const run = async (query) => {
    const id = ++latest;
    const q = query.trim();
    history.replaceState(null, '', q ? `?q=${encodeURIComponent(q)}` : location.pathname);
    if (!q) {
      list.replaceChildren();
      status.textContent = '검색어를 입력하세요. 공개된 글만 검색됩니다.';
      return;
    }
    try {
      pagefind ??= await import('/pagefind/pagefind.js');
      const search = await pagefind.debouncedSearch(q, {}, 200);
      if (search === null || id !== latest) return;
      const results = await Promise.all(search.results.slice(0, 20).map((r) => r.data()));
      if (id !== latest) return;
      render(results);
      status.textContent = results.length ? `${search.results.length}개 찾음` : `grep: '${q}': 일치하는 글이 없습니다.`;
    } catch {
      status.textContent = '검색 색인을 불러오지 못했습니다. 잠시 뒤 다시 시도하세요.';
    }
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    run(input.value);
  });
  input.addEventListener('input', () => run(input.value));
  const initial = new URLSearchParams(location.search).get('q');
  if (initial) {
    input.value = initial;
    run(initial);
  }
  input.focus();
</script>
